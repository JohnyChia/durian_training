name: Render Model 1-5 PNG metrics

on:
  push:
    branches:
      - model-synthetic-and-hybrid
    paths:
      - .github/workflows/render-model-metrics-png.yml
      - scripts/render_model_metrics.py

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Checkout only repository pointers and text
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plot library
        run: python -m pip install --disable-pip-version-check matplotlib

      - name: Generate real PNG plots from archived original CSV files
        run: python scripts/render_model_metrics.py

      - name: Commit PNG plots to same model branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models_8run/model*/results/png/*.png
          if git diff --cached --quiet; then
            echo "PNG files are unchanged."
            exit 0
          fi
          git commit -m "Render model 1-5 training metrics as PNG charts"
          git push origin HEAD:model-synthetic-and-hybrid
