name: Verify preserved Synthetic model artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - model-synthetic-and-hybrid
    paths:
      - models_8run/model1_yolo26n_synthetic/**
      - models_8run/model3_yolo26n_p2_synthetic/**
      - models_8run/model5_rfdetr_n_synthetic/**
      - .github/workflows/upload-model12.yml

permissions:
  contents: read

jobs:
  verify-synthetic-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout model branch with LFS artifacts
        uses: actions/checkout@v4
        with:
          ref: model-synthetic-and-hybrid
          fetch-depth: 1
          lfs: true

      - name: Verify preserved inference checkpoints
        shell: bash
        run: |
          set -euo pipefail
          echo "b7e221be1716737941f9ac0bfeab832e6fce67f405a1d0f133287ce84e2b4ef0  models_8run/model1_yolo26n_synthetic/best.pt" | sha256sum -c -
          echo "a8ae50bfea646f34849961be3204b9860dcf7c7e87de159498c7b59872fd369d  models_8run/model3_yolo26n_p2_synthetic/best.pt" | sha256sum -c -
          echo "f2912b418819bc6732958f103b07708c95e3bad15219e5cbcc9f0bccda7ef744  models_8run/model5_rfdetr_n_synthetic/weights/checkpoint_best_ema.pth" | sha256sum -c -

      - name: Reject historical Hybrid directories
        shell: bash
        run: |
          set -euo pipefail
          test ! -e models_8run/model2_yolo26n_hybrid
          test ! -e models_8run/model4_yolo26n_p2_hybrid
          test ! -e models_8run/model6_rfdetr_n_hybrid
