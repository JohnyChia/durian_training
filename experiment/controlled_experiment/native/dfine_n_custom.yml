__include__:
  - ../dataset/coco_detection.yml
  - ../runtime.yml
  - ./include/dataloader.yml
  - ./include/optimizer.yml
  - ./include/dfine_hgnetv2.yml

output_dir: __DURIAN_OUTPUT_DIR__
num_classes: 6
remap_mscoco_category: true
epochs: 100

DFINE: {backbone: HGNetv2}
HGNetv2: {name: B0, return_idx: [2, 3], freeze_at: -1, freeze_norm: false, use_lab: true}
HybridEncoder: {in_channels: [512, 1024], feat_strides: [16, 32], hidden_dim: 128, use_encoder_idx: [1], dim_feedforward: 512, expansion: 0.34, depth_mult: 0.5}
DFINETransformer: {feat_channels: [128, 128], feat_strides: [16, 32], hidden_dim: 128, dim_feedforward: 512, num_levels: 2, num_layers: 3, eval_idx: -1, num_points: [6, 6]}

optimizer:
  type: AdamW
  lr: 0.000025
  betas: [0.9, 0.999]
  weight_decay: 0.0001
  params:
    - {params: '^(?=.*backbone)(?!.*norm|bn).*$', lr: 0.0000125}
    - {params: '^(?=.*backbone)(?=.*norm|bn).*$', lr: 0.0000125, weight_decay: 0.0}
    - {params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$', weight_decay: 0.0}

train_dataloader:
  total_batch_size: 4
  dataset:
    img_folder: __DURIAN_TRAIN_IMAGES__
    ann_file: __DURIAN_TRAIN_ANNOTATIONS__
    transforms:
      policy: {epoch: 88}
  collate_fn: {stop_epoch: 88, ema_restart_decay: 0.9999, base_size_repeat: null}

val_dataloader:
  total_batch_size: 4
  dataset:
    img_folder: __DURIAN_VAL_IMAGES__
    ann_file: __DURIAN_VAL_ANNOTATIONS__
