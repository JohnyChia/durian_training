experiment: advanced
description: Six-class YOLO26 detector with an ImageNet-pretrained EfficientNet-B0
  backbone.
model: experiment/yaml/yolo26n_efficientnet.yaml
pretrained_detector: yolo26n.pt
imagenet_normalize: true
data: experiment/yaml/baseline_data.yaml
dataset_audit: experiment/hybrid_dataset/audit.json
dataset_view: hybrid
expected_classes:
- leaf_algal
- leaf_blight
- leaf_colletotrichum
- leaf_healthy
- leaf_phomopsis
- leaf_rhizoctonia
output: models/durian_leaf/advanced.pt
project: experiment/outputs/training_model
run_name: advanced
train:
  epochs: 200
  imgsz: 1280
  batch: 3
  device: '0'
  workers: 4
  patience: 40
  close_mosaic: 15
  seed: 20260917
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: true
  freeze: 0
  mosaic: 0.5
  mixup: 0.0
  scale: 0.3
  translate: 0.1
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.3
  erasing: 0.0
  amp: true
evaluations:
  real: experiment/hybrid_dataset/evaluation/real.yaml
  gazebo: experiment/hybrid_dataset/evaluation/gazebo.yaml
