# Advanced — EfficientNet-B0 backbone + YOLO26-compatible detector
#
# Goal:
#   Keep EfficientNet-B0 as the Advanced backbone while preserving
#   the official YOLO26n neck/head topology and channel dimensions.
#
# EfficientNet feature indices:
#   P3/8  = index 4 = 40 channels
#   P4/16 = index 6 = 112 channels
#   P5/32 = index 9 = 1280 channels

nc: 6
end2end: true
reg_max: 1

backbone:
  # ImageNet-pretrained EfficientNet-B0
  - [-1, 1, TorchVision, [1280, efficientnet_b0, DEFAULT, true, 2, true]]

  # Extract P3 / P4 / P5
  - [0, 1, Index, [40, 4]]
  - [0, 1, Index, [112, 6]]
  - [0, 1, Index, [1280, 9]]

  # Adapt EfficientNet features to official YOLO26n neck widths:
  # P3 = 128, P4 = 128, P5 = 256
  - [1, 1, Conv, [128, 1, 1]]
  - [2, 1, Conv, [128, 1, 1]]
  - [3, 1, Conv, [256, 1, 1]]

head:
  # Equivalent to official YOLO26n layers 09-10
  - [6, 1, SPPF, [256, 5]]
  - [-1, 1, C2PSA, [256]]

  # Official top-down P5 -> P4
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, true]]

  # Official top-down P4 -> P3
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [64, true]]

  # Official bottom-up P3 -> P4
  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, true]]

  # Official bottom-up P4 -> P5
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, true]]

  # P3/8, P4/16, P5/32
  - [[14, 17, 20], 1, Detect, [nc]]
