experiment: baseline
description: Six-class YOLO trained on the audited image- and box-balanced real/Gazebo dataset.
model: yolo26n.pt
data: experiment/yaml/baseline_data.yaml
dataset_audit: experiment/hybrid_dataset/audit.json
dataset_view: hybrid
expected_classes:
  - leaf_algal
  - leaf_blight
  - leaf_colletotrichum
  - leaf_healthy
  - leaf_phomopsis
  - leaf_rhizoctonia
output: models/durian_leaf/baseline.pt
project: experiment/outputs/training_model
run_name: baseline
train:
  epochs: 200
  imgsz: 1280
  batch: -1
  device: "0"
  workers: 4
  patience: 40
  close_mosaic: 15
  seed: 20260917
evaluations:
  real: experiment/hybrid_dataset/evaluation/real.yaml
  gazebo: experiment/hybrid_dataset/evaluation/gazebo.yaml
