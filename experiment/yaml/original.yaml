experiment: original
description: Six-class YOLO trained only on the audited, group-disjoint Gazebo subset.
model: yolo26n.pt
data: experiment/yaml/original_data.yaml
dataset_audit: experiment/hybrid_dataset/audit.json
dataset_view: original
expected_classes:
  - leaf_algal
  - leaf_blight
  - leaf_colletotrichum
  - leaf_healthy
  - leaf_phomopsis
  - leaf_rhizoctonia
output: models/durian_leaf/original.pt
project: experiment/outputs/training_model
run_name: original
train:
  epochs: 200
  imgsz: 1280
  batch: -1
  device: "0"
  workers: 4
  patience: 40
  close_mosaic: 15
  seed: 20260917
evaluations:
  gazebo: experiment/hybrid_dataset/evaluation/gazebo.yaml
